# CI de nodefony — générée par `nodefony create app` (GitLab).
#
# Même filet que le workflow GitHub, même doctrine : `verify` (typecheck +
# lint + tests + CONSTRUCTION + `nodefony doctor`) puis la suite e2e qui démarre
# l'application POUR DE VRAI et l'interroge en HTTP. Le fichier est inerte hors
# GitLab — les deux forges sont servies, le dépôt choisit en poussant.
#
# 🔴 La construction est DANS `verify`, pas ici : `nodefony doctor` refuse une
# application non construite, et un correctif écrit dans ce fichier seul
# laisserait `npm run verify` rouge sur le poste du développeur.

verify:
  image: node:24
  # Les branches et les demandes de fusion — jamais une étiquette, qui
  # rejouerait à l'identique la chaîne d'un commit déjà éprouvé.
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: always
  # `interruptible` REND le job annulable quand un envoi plus récent arrive —
  # c'est le projet qui décide ensuite de l'annuler (« auto-cancel redundant
  # pipelines », activé par défaut). Et la borne évite qu'un démarrage qui pend
  # mange le quota de la journée.
  interruptible: true
  timeout: 20 minutes
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  script:
    - npm ci --cache .npm --prefer-offline
    # typecheck, lint, format:check, env:check, test, build, `nodefony doctor` — l'ordre du script.
    - npm run verify
    # L'application DÉMARRE et répond en HTTP : la seule preuve qui compte.
    - npm run test:e2e

# 🔴 L'IMAGE est l'artefact qu'on PUBLIE, et le seul que rien ne regardait.
# Un secret qui y entre est public : une couche reste téléchargeable même quand
# une couche suivante efface le fichier — un `COPY` puis un `rm` donne donc une
# image où le secret est absent du système de fichiers et présent dans le
# registre. Ni le `.dockerignore` (qui filtre le contexte, pas ce que la
# construction produit) ni un `rm` dans le Dockerfile ne ferment ce chemin.
#
# Job SÉPARÉ du `verify`, et pour une raison de décor : construire une image
# demande un démon docker, que le conteneur de `verify` n'a pas.
image-check:
  # 🔴 `node:24`, et surtout PAS `docker:28` malgré les apparences. L'image
  # officielle de docker est une Alpine dont les dépôts ne servent que Node 22
  # (`nodejs`) ou 23 (`nodejs-current`) : le framework en exige 24, et le
  # démarrage y meurt sur `SyntaxError: Unexpected identifier` — une syntaxe
  # que Node 23 ne connaît pas. Mesuré, les deux. On part donc de Node et on
  # ajoute le CLIENT docker, jamais l'inverse.
  image: node:24
  # Le démon vit dans un service ; `DOCKER_HOST` l'y envoie. Le répertoire de
  # certificats est PARTAGÉ par le service, c'est lui qui les fabrique.
  services:
    - name: docker:28-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: 1
    DOCKER_CERT_PATH: "/certs/client"
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: always
  interruptible: true
  timeout: 20 minutes
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    # Le CLIENT seul — le démon est le service ci-dessus. Le nom du paquet a
    # changé selon les versions de Debian : on tente les deux plutôt que de
    # parier sur celui de l'image du jour.
    - apt-get update -qq
    - >-
      apt-get install -y -qq --no-install-recommends docker-cli
      || apt-get install -y -qq --no-install-recommends docker.io
  script:
    - npm ci --cache .npm --prefer-offline
    - docker build -t nodefony:ci .
    # `nodefony image:check` lit les COUCHES et refuse par un code non nul. Un
    # contrôle qui n'a pas PU regarder (démon injoignable, couche illisible)
    # sort en 69, pas en 0 : ce job échoue alors, ce qui est voulu.
    - npm exec -- nodefony image:check nodefony:ci
