# Thème de connexion Nodefony, habillage « dots » — le même que la page
# /login du framework avec `loginPage.skin: "dots"`.
#
# HÉRITE du thème `nodefony` : gabarit, textes, images et propriétés viennent
# de lui ; seuls la feuille d'habillage (copie conforme de
# `nodefony/login/skins/dots.css`, éprouvée par le test des copies) et la
# mise en page de l'habillage sont posées ici. Le realm le choisit par
# `loginTheme` (`security:keycloak:realm --write` le dérive de la config).
parent=nodefony
styles=css/styles.css css/login.css css/nodefony.css css/skins/dots.css
nfSkin=dots
nfLayout=card
