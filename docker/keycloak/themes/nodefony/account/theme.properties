# Console du compte de l'utilisateur (Keycloak) aux couleurs de Nodefony.
#
# HÉRITE de `keycloak.v3` : la console est une application React livrée par
# Keycloak. Seuls le logo, l'icône d'onglet et une feuille de VARIABLES sont
# posés ici — la console reste celle de Keycloak, juste à chaque mise à jour.
# Le mode sombre (`darkMode`, `kcDarkModeClass`) est hérité du parent.
parent=keycloak.v3
# Chemins depuis les ressources du thème (`resources/`), barre INITIALE
# comprise : la console d'administration les colle à leur URL sans séparateur.
logo=/img/logo.png
favIcon=/img/favicon.ico
favIconType=image/x-icon
title=Nodefony · Account
styles=css/nodefony.css
