# Page d'accueil du serveur Keycloak aux couleurs de Nodefony.
#
# Le seul type qui ne se choisit PAS par realm : le serveur le désigne par
# l'option `spi-theme--welcome-theme` (variable `KC_SPI_THEME__WELCOME_THEME`
# dans le compose). Elle ne s'affiche qu'avant le premier administrateur —
# ensuite, le parent redirige vers la console d'administration.
# HÉRITE de `keycloak` : logo et fond remplacés par la feuille, rien d'autre.
parent=keycloak
import=common/keycloak
stylesCommon=vendor/patternfly-v5/patternfly.min.css vendor/patternfly-v5/patternfly-addons.css
styles=css/welcome.css css/nodefony.css
